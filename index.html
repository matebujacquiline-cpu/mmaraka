<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mmaraka — Find it. Sell it. Earn.</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f0e6;
      color: #1f1f1f;
    }

    header {
      background: #0e3b2e;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #d4a556;
      margin-bottom: 0;
    }

    .search {
      margin: 20px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #ccc;
      width: calc(100% - 70px);
      font-size: 16px;
    }

    .container {
      padding: 10px 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .category {
      background: white;
      padding: 18px;
      border-radius: 15px;
      text-align: center;
      font-weight: bold;
    }

    .featured {
      margin-top: 25px;
    }

    .product {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-top: 12px;
    }

    .price {
      color: #0e3b2e;
      font-weight: bold;
      font-size: 20px;
    }

    .sell {
      display: block;
      background: #d4a556;
      color: #1f1f1f;
      padding: 15px;
      text-align: center;
      border-radius: 12px;
      margin-top: 25px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>MMARAKA</h1>
  <p>Find it. Sell it. Earn.</p>
</header>

<input class="search" type="text" placeholder="🔍 Search products or services">

<div class="container">

  <h2>Categories</h2>

  <div class="categories">
    <div class="category">👗 Fashion</div>
    <div class="category">🍰 Food</div>
    <div class="category">💇 Beauty</div>
    <div class="category">🔧 Services</div>
    <div class="category">📱 Electronics</div>
    <div class="category">👜 Handmade</div>
    <div class="category">📚 Tutoring</div>
    <div class="category">••• More</div>
  </div>

  <div class="featured">
    <h2>⭐ Featured near you</h2>

    <div class="product">
      <h3>Custom Tote Bag</h3>
      <p>Beautiful handmade tote bag.</p>
      <p class="price">P120</p>
      <p>📍 Francistown</p>
    </div>

    <div class="product">
      <h3>Red Velvet Cake</h3>
      <p>Fresh homemade cake.</p>
      <p class="price">P150</p>
      <p>📍 Gaborone</p>
    </div>

  </div>

  <a class="sell" href="#">➕ Sell Something</a>

</div>

</body>
      </html>
